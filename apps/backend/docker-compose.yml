services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: zayan
      POSTGRES_PASSWORD: zayan
      POSTGRES_DB: zayan_max
    ports:
      - "5434:5432"
    volumes:
      - zayan_max_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  zayan_max_postgres:
